<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه درسی کلاس ۱۱ پایگاه</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Vazirmatn,Tahoma,sans-serif;
    background:#0f1420;
    color:#e8ecf5;
    min-height:100vh;
    padding:40px 16px;
    line-height:1.8;
  }
  .container{max-width:900px;margin:0 auto}
  header{text-align:center;margin-bottom:40px}
  h1{font-size:1.8rem;margin-bottom:10px;color:#fff}
  .sub{color:#9aa7bd;font-size:.9rem;max-width:640px;margin:0 auto}
  .sub strong{color:#e8ecf5}

  .days{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    margin-bottom:40px;
  }
  .day{
    background:#1a2233;
    border:1px solid #263049;
    border-radius:14px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
  }
  .day:hover{background:#222c42;border-color:#3a4a6b;transform:translateY(-3px)}
  .day .name{font-size:1.05rem;font-weight:700;margin-bottom:6px}
  .day .date{font-size:.8rem;color:#8b98b0}

  .note{
    background:#1a2233;
    border:1px solid #263049;
    border-radius:14px;
    padding:24px;
    display:none;
  }
  .note.open{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #263049}
  .note-head h2{font-size:1.15rem;color:#fff}
  .note-head .date{font-size:.85rem;color:#8b98b0}
  .close{
    background:#263049;border:none;color:#e8ecf5;
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;
  }
  .close:hover{background:#33405e}
  .note-body{white-space:pre-wrap;color:#c8d2e3;font-size:.95rem}

  footer{
    text-align:center;color:#8b98b0;font-size:.85rem;
    margin-top:50px;padding-top:24px;border-top:1px solid #1f2739;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>برنامه درسی کلاس ۱۱ پایگاه</h1>
    <p class="sub">
      برنامه‌ها به صورت هفتگی هستند. هر برنامه‌ای که اکنون مشاهده می‌کنید مربوط به هفته فعلی یا آینده است.
      در صورت اینکه هر درسی در برنامه‌ها تکمیل شود، آن درس حذف خواهد شد.
    </p>
  </header>

  <div class="days" id="days"></div>

  <div class="note" id="note">
    <div class="note-head">
      <div>
        <h2 id="noteTitle"></h2>
        <div class="date" id="noteDate"></div>
      </div>
      <button class="close" id="closeBtn">✕</button>
    </div>
    <div class="note-body" id="noteBody"></div>
  </div>

  <footer>
    ساخته شده به درخواست محمد جواد رحیمی — ۱۴۰۵
  </footer>

</div>

<script>
/* ============================================================
   ویرایش اینجا:
   برای هر روز، فیلد note را با متن تکالیف همان روز پر کن.
   ============================================================ */
const schedule = [
  { day: "شنبه",    date: "۱۴۰۵/۰۸/۱۰", note: "تکالیف اینجا..." },
  { day: "یکشنبه",  date: "۱۴۰۵/۰۸/۱۱", note: "تکالیف اینجا..." },
  { day: "دوشنبه",  date: "۱۴۰۵/۰۸/۱۲", note: "تکالیف اینجا..." },
  { day: "سه‌شنبه", date: "۱۴۰۵/۰۸/۱۳", note: "تکالیف اینجا..." },
  { day: "چهارشنبه",date: "۱۴۰۵/۰۸/۱۴", note: "تکالیف اینجا..." }
];

const daysEl = document.getElementById('days');
const noteEl = document.getElementById('note');
const noteTitle = document.getElementById('noteTitle');
const noteDate = document.getElementById('noteDate');
const noteBody = document.getElementById('noteBody');
const closeBtn = document.getElementById('closeBtn');

schedule.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'day';
  el.innerHTML = `<div class="name">${s.day}</div><div class="date">${s.date}</div>`;
  el.addEventListener('click', () => openNote(s));
  daysEl.appendChild(el);
});

function openNote(s) {
  noteTitle.textContent = s.day;
  noteDate.textContent = s.date;
  noteBody.textContent = s.note;
  noteEl.classList.add('open');
  noteEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

closeBtn.addEventListener('click', () => {
  noteEl.classList.remove('open');
});
</script>
</body>
</html>
